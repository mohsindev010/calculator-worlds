<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-label="Calculator and chart illustration">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="0.7" stop-color="#e3e9ff"/>
      <stop offset="1" stop-color="#eef2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mbody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d8cf0"/>
      <stop offset="1" stop-color="#6366e8"/>
    </linearGradient>
  </defs>
  <circle cx="150" cy="140" r="108" fill="url(#orb)"/>
  <circle cx="150" cy="140" r="108" fill="none" stroke="#e2e6ff" stroke-width="2"/>

  <!-- chart card -->
  <g>
    <rect x="150" y="82" width="132" height="92" rx="14" fill="#ffffff" opacity="0.9"/>
    <path d="M164 150 L188 130 L208 140 L232 112 L262 124" fill="none" stroke="#c9ccf3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="232" cy="112" r="4" fill="#9ba0ec"/>
  </g>

  <!-- calculator -->
  <g transform="translate(112 148) rotate(-10)">
    <rect x="-48" y="-72" width="96" height="144" rx="14" fill="url(#mbody)"/>
    <rect x="-38" y="-62" width="76" height="26" rx="6" fill="#c8cbfa"/>
    <g fill="#4a4dc9" opacity="0.9">
      <rect x="-38" y="-24" width="20" height="16" rx="4"/><rect x="-10" y="-24" width="20" height="16" rx="4"/><rect x="18" y="-24" width="20" height="16" rx="4"/>
      <rect x="-38" y="0" width="20" height="16" rx="4"/><rect x="-10" y="0" width="20" height="16" rx="4"/><rect x="18" y="0" width="20" height="16" rx="4"/>
      <rect x="-38" y="24" width="20" height="16" rx="4"/><rect x="-10" y="24" width="20" height="16" rx="4"/>
    </g>
    <rect x="18" y="24" width="20" height="40" rx="4" fill="#ffb56b"/>
    <rect x="-38" y="48" width="48" height="16" rx="4" fill="#4a4dc9" opacity="0.9"/>
  </g>

  <!-- sparkles -->
  <g fill="#7dd3fc">
    <path d="M40 74 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M290 150 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
  </g>
  <g fill="#f0abfc">
    <path d="M258 40 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
  </g>
  <path d="M70 210 l4 8 8 4 -8 4 -4 8 -4 -8 -8 -4 8 -4z" fill="#f472b6"/>
</svg>
